<!DOCTYPE html>

<style>
:root{color-scheme:dark;--bg:#12161f;--fg:#f2f5fa;--ac:#ffb400;--ac2:#00e5ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#mirw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);left:50%;transform:translateX(-50%);width:200px;height:80px;border:3px solid #6b7488;border-radius:12px;overflow:hidden;box-shadow:0 0 14px #000a}
#mir{width:100%;height:100%;display:block}

#ctl{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#ctl>*{pointer-events:auto}
#wheel{width:140px;height:140px;border-radius:50%;border:12px solid #4b5568;position:relative;background:radial-gradient(circle,#2a3140 0 22%,transparent 23%),linear-gradient(90deg,transparent 46%,#4b5568 46% 54%,transparent 54%);box-shadow:0 0 0 3px #0008 inset,0 0 16px var(--ac2)44;touch-action:none}

#ov .b{width:min(320px,86vw);font-size:16px}#lv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(360px,90vw)}#lv .b{width:auto;min-width:0;font-size:14px;padding:8px 2px;line-height:1.3}.b:disabled{opacity:.35}.hide{display:none!important}

<canvas id="g"></canvas>
<div id="hud"><div><div id="h1"></div><div id="h2"></div></div><div style="text-align:right"><div id="h3"></div><div id="bar"><i id="bi" style="width:100%"></i></div></div></div>
<div id="mirw"><canvas id="mir"></canvas></div>
<div id="ctl">
 <div id="wheel"></div>
 <div id="gears"><button class="b" id="gD">D</button><button class="b" id="gN">N</button><button class="b" id="gR">R</button></div>
 <div id="right"><div id="col"><button class="b" id="horn">Klaxon</button><button class="b" id="dump">Benne</button></div><div class="ped" id="brk">FREIN</div><div class="ped" id="gas">GAZ</div></div>
</div>
<div id="ov"></div>
<script>
/* ===== 0. UTILS / CANVAS ===== */
const $=i=>document.getElementById(i),cv=$('g'),cx=cv.getContext('2d'),mc=$('mir'),mx=mc.getContext('2d');
let W,H,DPR,LX=0,LY=-1;
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;mc.width=200*DPR;mc.height=80*DPR}
addEventListener('resize',rs);rs();
const nd=a=>Math.atan2(Math.sin(a),Math.cos(a)),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);

/* ===== 1. DONNÉES NIVEAUX (data-driven) ===== */
const TL=[120,95];
const LV={
 park:{n:'Parking de précision',w:900,h:600,s:[270,480,0],tr:1,cargo:0,type:'park',
  goal:{x:760,y:150,w:80,h:180},
  walls:[[650,60,66,150,'c'],[804,60,66,150,'c'],[330,170,60,110,'c'],[560,330,60,110,'c'],[200,230,40,40,'w']]},
 rush:{n:'Rush Hour',w:1800,h:700,s:[270,350,0],tr:1,cargo:100,gtype:'gravel',time:60,type:'zone',
  goal:{x:1660,y:350,w:200,h:220},
  walls:[[450,0,40,430,'w'],[800,270,40,430,'w'],[1150,0,40,430,'w']]},
 convoy:{n:'Cauchemar du Convoi',w:2300,h:900,s:[340,450,0],tr:2,cargo:100,gtype:'liquid',type:'zone',auto:1,
  goal:{x:2140,y:450,w:220,h:260},
  walls:[[500,0,40,600,'w'],[900,300,40,600,'w'],[1300,0,40,600,'w'],[1700,300,40,600,'w']]}
};
/* ===== 1b. CAMPAGNE : 10 niveaux, difficulté croissante, étoiles sauvegardées ===== */
const SAVE=(()=>{try{return JSON.parse(localStorage.getItem('cvx')||'[]')}catch(e){return[]}})();
const cars=(g,x=760)=>[[x-g/2-66,60,66,150,'c'],[x+g/2,60,66,150,'c']];
const X2=[[330,170,60,110,'c'],[560,330,60,110,'c']];
const GW=(a,b)=>[[500,0,40,a,'w'],[900,b,40,900-b,'w'],[1300,0,40,a,'w'],[1700,b,40,900-b,'w']];
const CAMP=[
{n:'1 · Premier créneau',b:'park',o:{goal:{x:760,y:150,w:120,h:180},walls:cars(120),st:[450,700]}},
{n:'2 · Créneau et obstacles',b:'park',o:{goal:{x:760,y:150,w:90,h:180},walls:cars(90).concat(X2),st:[450,700]}},
{n:'3 · Créneau serré',b:'park',o:{goal:{x:760,y:150,w:68,h:180},walls:cars(68).concat(X2,[[200,230,40,40,'w'],[430,200,40,170,'w']]),st:[450,700]}},
{n:'4 · Double remorque',b:'park',o:{tr:2,s:[380,480,0],goal:{x:760,y:150,w:84,h:190},walls:cars(84).concat([[330,170,60,110,'c']]),st:[400,650]}},
{n:'5 · Rush facile',b:'rush',o:{time:80,st:[1500,2200]}},
{n:'6 · Rush Hour',b:'rush',o:{st:[1200,1800]}},
{n:'7 · Rush liquide',b:'rush',o:{gtype:'liquid',time:60,st:[1100,1700]}},
{n:'8 · Rush : le goulot',b:'rush',o:{time:55,walls:LV.rush.walls.concat([[1500,0,40,250,'w'],[1500,450,40,250,'w']]),st:[1000,1600]}},
{n:'9 · Convoi',b:'convoy',o:{st:[1500,1900]}},
{n:'10 · Cauchemar',b:'convoy',o:{gtype:'gravel',walls:GW(640,260),st:[1400,1800]}}];
/* ===== 1c. GARAGE : pièces gagnées à chaque livraison, améliorations permanentes ===== */
const GAR=(()=>{try{return Object.assign({c:0,s:0,e:0,t:0,p:0},JSON.parse(localStorage.getItem('cvx2')||'{}'))}catch(e){return{c:0,s:0,e:0,t:0,p:0}}})();
const PAINT=['#ff9d00','#e63946','#2a9d8f','#9b5de5','#e9edf5'],PAINT2=['#ffb733','#ff6b78','#45c4b4','#b98af2','#ffffff'];
function sv2(){try{localStorage.setItem('cvx2',JSON.stringify(GAR))}catch(e){}}
function garage(){const o=$('ov'),N=['Suspension (charge plus stable)','Moteur (accélération et vitesse)','Pneus (braquage et freinage)'],K=['s','e','t'],P=[300,600,1000];
 o.innerHTML='<h1>GARAGE</h1><p>'+GAR.c+' 🪙</p>'+K.map((k,i)=>{const lv=GAR[k];return '<button class="b" data-u="'+k+'">'+N[i]+' · niv. '+lv+'/3'+(lv<3?' — '+P[lv]+' 🪙':' — MAX')+'</button>'}).join('')+'<button class="b" data-u="p" style="background:'+PAINT[GAR.p]+';color:#111">Peinture : changer ('+(GAR.p+1)+'/'+PAINT.length+')</button><button class="b" data-u="x">◀ Retour</button>';
 o.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.u;if(k=='x')return menu('CONVOY EXTREME','Choisis un niveau.');if(k=='p')GAR.p=(GAR.p+1)%PAINT.length;else if(GAR[k]<3&&GAR.c>=P[GAR[k]]){GAR.c-=P[GAR[k]];GAR[k]++;tone(880,.15)}sv2();garage()})}
/* ===== 2. ÉTAT & ENTRÉES ===== */
let G=null,keys={},T={gas:0,brk:0,wheel:0,gear:1,horn:0},wr=0,wdrag=0,shk=0;
const parts=[],conf=[],txt=[],rings=[];
function segs(g){const S=[{x:g.x,y:g.y,a:g.a,len:70,wd:40,cab:1}];let hx=g.x-Math.cos(g.a)*30,hy=g.y-Math.sin(g.a)*30;
 g.ph.forEach((p,i)=>{const L=TL[i],c=Math.cos(p),s=Math.sin(p);S.push({x:hx-c*L/2,y:hy-s*L/2,a:p,len:L,wd:44,i});hx-=c*L;hy-=s*L});S.rear=[hx,hy];return S}
function start(k){const c=CAMP[k],l=Object.assign({},LV[c.b],c.o,{n:c.n});aud();
 const walls=[[-40,-40,l.w+80,40,'w'],[-40,l.h,l.w+80,40,'w'],[-40,0,40,l.h,'w'],[l.w,0,40,l.h,'w']].concat(l.walls);
 G={k,l,walls,x:l.s[0],y:l.s[1],a:l.s[2],v:0,st:0,ph:Array(l.tr).fill(l.s[2]),o:0,od:0,p:0,pd:0,cargo:l.cargo,hits:0,t:l.time||0,el:0,cd:0,hold:0,done:0,cam:[l.s[0],l.s[1]],bt:0};
 parts.length=conf.length=txt.length=rings.length=0;T.gear=1;$('ov').classList.add('hide');setGear();txt.push({t:'Maintiens GAZ (ou ↑)',x:W/2,y:H*.3,a:0,c:'#ffffff',sz:26})}
function setGear(){['D','N','R'].forEach((n,i)=>$('g'+n).classList.toggle('on',T.gear===[1,0,-1][i]))}
/* clavier */
addEventListener('keydown',e=>{keys[e.code]=1;aud();if(e.code=='ArrowUp'||e.code=='KeyW'){T.gear=1;setGear()}if(e.code=='ArrowDown'||e.code=='KeyS'){T.gear=-1;setGear()}if(e.code=='KeyH')horn();if(e.code=='KeyB')dump();if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
/* tactile : pédales, leviers */
function hold(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();aud();fn(1);el.classList.add('on')});['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>{fn(0);el.classList.remove('on')}))}
hold($('gas'),v=>T.gas=v);hold($('brk'),v=>T.brk=v);
$('gD').onclick=()=>{T.gear=1;setGear()};$('gN').onclick=()=>{T.gear=0;setGear()};$('gR').onclick=()=>{T.gear=-1;setGear()};
$('horn').addEventListener('pointerdown',()=>{aud();horn()});$('dump').addEventListener('pointerdown',()=>{aud();dump()});
/* volant virtuel : drag circulaire, rappel automatique */
const wh=$('wheel');let w0=0,r0=0;
const wa=e=>{const b=wh.getBoundingClientRect();return Math.atan2(e.clientY-b.top-b.height/2,e.clientX-b.left-b.width/2)};
wh.addEventListener('pointerdown',e=>{wh.setPointerCapture(e.pointerId);wdrag=1;w0=wa(e);r0=wr;aud()});
wh.addEventListener('pointermove',e=>{if(wdrag)wr=cl(r0+nd(wa(e)-w0),-2.4,2.4)});
['pointerup','pointercancel'].forEach(t=>wh.addEventListener(t,()=>wdrag=0));

/* ===== 3. AUDIO (WebAudio procédural) ===== */
let AC,eng,eg,tb,tg;
function aud(){if(AC)return AC.resume&&AC.resume();AC=new(window.AudioContext||window.webkitAudioContext)();
 eng=AC.createOscillator();eng.type='sawtooth';const lp=AC.createBiquadFilter();lp.frequency.value=380;eg=AC.createGain();eg.gain.value=0;eng.connect(lp);lp.connect(eg);eg.connect(AC.destination);eng.start();
 tb=AC.createOscillator();tg=AC.createGain();tg.gain.value=0;tb.connect(tg);tg.connect(AC.destination);tb.start()}
function tone(f,d,ty='square',v=.08,f2){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;if(f2)o.frequency.linearRampToValueAtTime(f2,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function horn(){tone(220,.5,'sawtooth',.12);tone(277,.5,'sawtooth',.1)}
function audUpd(g,gas,dt){if(!AC)return;const t=AC.currentTime,v=Math.abs(g.v);
 eng.frequency.setTargetAtTime(42+v*.32+gas*28,t,.06);eg.gain.setTargetAtTime(g.done?0:.07+gas*.06,t,.1);
 tb.frequency.setTargetAtTime(2200+gas*v*9,t,.1);tg.gain.setTargetAtTime(gas*(v/240)*.025,t,.15);
 if(T.gear<0&&!g.done){g.bt-=dt;if(g.bt<=0){tone(1000,.18);g.bt=.55}}}

/* ===== 4. PHYSIQUE : camion articulé + cargaison ===== */
function hitTest(g){const S=segs(g);for(const s of S){const c=Math.cos(s.a),n=Math.sin(s.a),hl=s.len/2,hw=s.wd/2;
  for(const [u,v] of [[-hl,-hw],[hl,-hw],[hl,hw],[-hl,hw],[0,-hw],[0,hw],[hl,0],[-hl,0]]){const px=s.x+u*c-v*n,py=s.y+u*n+v*c;
   for(const r of g.walls)if(px>r[0]&&px<r[0]+r[2]&&py>r[1]&&py<r[1]+r[3])return[px,py]}}return 0}
function step(g,dt){if(g.done)return;g.el+=dt;if(g.l.time){g.t-=dt;if(g.t<=0)return fin(0)}
 const gas=Math.max(T.gas,keys.ArrowUp||keys.ArrowDown||keys.KeyW||keys.KeyS?1:0),brk=Math.max(T.brk,keys.Space?1:0);
 const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
 if(!wdrag){wr*=Math.max(0,1-dt*(kx?0:6))}if(kx)wr=cl(wr+kx*dt*5,-2.4,2.4);
 const snap={x:g.x,y:g.y,a:g.a,ph:g.ph.slice()},pv=g.v;
 /* moteur / freins / traînée */
 g.v+=gas*T.gear*(T.gear>0?210:120)*(1+.1*GAR.e)*dt;
 const dv=((brk?460*(1+.1*GAR.t):0)+(gas&&T.gear?0:70)+.35*Math.abs(g.v))*dt;g.v=Math.abs(g.v)<=dv?0:g.v-Math.sign(g.v)*dv;g.v=cl(g.v,-95,(g.l.tr>1?190:240)*(1+.06*GAR.e));
 /* braquage limité (diminue avec la vitesse) */
 const lim=.62/(1+Math.abs(g.v)/(170*(1+.12*GAR.t)));g.st+=(cl(wr/2.4,-1,1)*lim-g.st)*Math.min(1,dt*8);
 const om=g.v/60*Math.tan(g.st);g.a+=om*dt;g.x+=Math.cos(g.a)*g.v*dt;g.y+=Math.sin(g.a)*g.v*dt;
 /* cinématique d'attelage : phi' = v/L * sin(theta_prec - phi) */
 let prev=g.a,jk=0;for(let i=0;i<g.ph.length;i++){let d=nd(prev-g.ph[i]);g.ph[i]+=g.v/TL[i]*Math.sin(d)*dt;d=nd(prev-g.ph[i]);if(Math.abs(d)>1.35){g.ph[i]=prev-Math.sign(d)*1.35;jk=1}prev=g.ph[i]}
 if(jk){g.v*=.9;if(Math.random()<.1)tone(rnd(90,140),.25,'sawtooth',.05)}
 /* collision : annule le mouvement, rebond, juice */
 const h=hitTest(g);g.cd-=dt;
 if(h){Object.assign(g,{x:snap.x,y:snap.y,a:snap.a,ph:snap.ph});g.v*=-.3;
  if(g.cd<=0){g.cd=.6;g.hits++;shk=12;tone(70,.3,'sawtooth',.2,40);for(let i=0;i<14;i++)parts.push({x:h[0],y:h[1],vx:rnd(-160,160),vy:rnd(-160,160),l:.5,c:'#ffd24a',s:3})}}
 /* charge vivante : ressort amorti sur axes latéral (o) et longitudinal (p) */
 if(g.cargo>0){const liq=g.l.gtype=='liquid',ks=liq?10:20,kd=liq?1.2:5,lat=g.v*om,lon=cl((g.v-pv)/dt,-500,500);
  g.od+=(-ks*g.o-kd*g.od-.07*(1-.15*GAR.s)*lat*(liq?1.4:1))*dt;g.o=cl(g.o+g.od*dt,-1.3,1.3);
  g.pd+=(-ks*g.p-kd*g.pd-.012*lon)*dt;g.p=cl(g.p+g.pd*dt,-1.3,1.3);
  const ex=Math.max(Math.abs(g.o)-.85,Math.abs(g.p)-1,0);
  if(ex>0){const l=g.cargo,r=ex*45*dt;g.cargo=Math.max(0,g.cargo-r);const [rx,ry]=segs(g).rear;
   for(let i=0;i<3;i++)parts.push({x:rx+rnd(-15,15),y:ry+rnd(-15,15),vx:rnd(-50,50),vy:rnd(-50,50),l:.9,c:liq?'#4db5ff':'#b19a72',s:liq?4:3});
   if(Math.floor(l/5)!=Math.floor(g.cargo/5)){shk=Math.max(shk,4);txt.push({t:'-5%',x:W/2,y:H*.3,a:0,c:'#ff6b6b',sz:26})}}}
 /* objectifs */
 const z=g.l.goal,S=segs(g);
 if(g.l.type=='park'){const s=S[S.length-1],c=Math.cos(s.a),n=Math.sin(s.a);
  const inn=[-1,1].every(k=>{const px=s.x+k*c*s.len/2,py=s.y+k*n*s.len/2;return Math.abs(px-z.x)<z.w/2&&Math.abs(py-z.y)<z.h/2});
  const err=Math.abs(nd(2*(s.a-Math.PI/2)))/2;g.err=err;
  if(inn&&err<.2&&Math.abs(g.v)<8)g.hold+=dt;else g.hold=0;if(g.hold>.8)fin(1,err)}
 else if(g.l.auto&&Math.abs(g.x-z.x)<z.w/2&&Math.abs(g.y-z.y)<z.h/2)fin(1);
 audUpd(g,gas,dt)}
function inZ(g){const z=g.l.goal;return Math.abs(g.x-z.x)<z.w/2&&Math.abs(g.y-z.y)<z.h/2}
function dump(){if(!G||G.done||G.l.type!='zone'||G.l.auto)return;if(inZ(G)){tone(120,.6,'sawtooth',.15,60);fin(1)}else txt.push({t:'Hors zone !',x:W/2,y:H*.35,a:0,c:'#ff9a3c',sz:26})}
function fin(win,err){G.done=1;const g=G;let sc=0,perf=0;
 if(win){if(g.l.type=='park'){sc=Math.max(0,Math.round(1000-err*2000-g.hits*100-g.el*5));perf=err<.08&&!g.hits}
  else{sc=Math.max(0,Math.round(g.cargo*10+(g.l.time?g.t*20:Math.max(0,60-g.el)*10)+(g.l.auto?500:0)-g.hits*50));perf=g.cargo>=95&&!g.hits}
  txt.push({t:perf?'PERFECT':'BRAVO !',x:W/2,y:H*.38,a:0,c:perf?'#ffd24a':'#00e5ff',sz:56});
  const z=g.l.goal;rings.push({x:z.x,y:z.y,r:10},{x:z.x,y:z.y,r:-40});
  for(let i=0;i<140;i++)conf.push({x:W/2,y:H*.4,vx:rnd(-380,380),vy:rnd(-620,-120),c:['#ffd24a','#00e5ff','#ff3df2','#7dff6b'][i%4],r:rnd(0,6),s:rnd(5,10),l:3});tone(660,.15);setTimeout(()=>tone(880,.15),130);setTimeout(()=>tone(1320,.3),260)}
 const stars=win?(sc>=g.l.st[1]?3:sc>=g.l.st[0]?2:1):0;const gain=win?Math.round(sc/5):0;GAR.c+=gain;sv2();if(stars>(SAVE[g.k]||0)){SAVE[g.k]=stars;try{localStorage.setItem('cvx',JSON.stringify(SAVE))}catch(e){}}
 setTimeout(()=>menu(win?'Livraison réussie ! '+'★'.repeat(stars)+'☆'.repeat(3-stars):'Temps écoulé',win?'Score : '+sc+' pts  ·  Chocs : '+g.hits+'  ·  +'+gain+' 🪙':'La cargaison n’est pas arrivée à temps.',g.k),1800)}

/* ===== 5. RENDU 2.5D (boîtes extrudées) ===== */
function box(c,x,y,w,h,a,ht,col,lift=0){const co=Math.cos(a),si=Math.sin(a),P=[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([u,v])=>[x+u*co-v*si,y+u*si+v*co]),ox=LX*lift,oy=LY*lift,hx=LX*(lift+ht),hy=LY*(lift+ht);
 for(let i=0;i<4;i++){const p=P[i],q=P[(i+1)%4];c.beginPath();c.moveTo(p[0]+ox,p[1]+oy);c.lineTo(q[0]+ox,q[1]+oy);c.lineTo(q[0]+hx,q[1]+hy);c.lineTo(p[0]+hx,p[1]+hy);c.closePath();c.fillStyle=col;c.fill();c.fillStyle='rgba(0,0,0,.34)';c.fill()}
 c.beginPath();P.forEach((p,i)=>c[i?'lineTo':'moveTo'](p[0]+hx,p[1]+hy));c.closePath();c.fillStyle=col;c.fill();c.strokeStyle='rgba(255,255,255,.14)';c.stroke()}
const loc=(s,u,v)=>[s.x+u*Math.cos(s.a)-v*Math.sin(s.a),s.y+u*Math.sin(s.a)+v*Math.cos(s.a)];
function veh(c,g){const S=segs(g),gt=g.l.gtype;
 if(!g.done&&T.gear){let x=g.x,y=g.y,a=g.a;const sg=T.gear,dd=sg*11;x+=Math.cos(a)*sg*35;y+=Math.sin(a)*sg*35;c.fillStyle=sg<0?'rgba(255,255,255,.6)':'rgba(0,229,255,.6)';for(let i=0;i<16;i++){a+=dd/60*Math.tan(g.st);x+=Math.cos(a)*dd;y+=Math.sin(a)*dd;c.beginPath();c.arc(x,y,3.2-i*.12,0,7);c.fill()}}
 for(let i=S.length-1;i>=0;i--){const s=S[i];
  for(const k of [-1,1])for(const u of(s.cab?[-22]:[-s.len/2+16,-s.len/2+32])){const p=loc(s,u,k*(s.wd/2+1));box(c,p[0],p[1],14,6,s.a,9,'#15181f')}
  if(s.cab){for(const k of[-1,1]){const fw=loc(s,24,k*21);box(c,fw[0],fw[1],17,7,s.a+g.st*1.4,10,'#dfe6f5')}box(c,s.x,s.y,70,40,s.a,14,PAINT[GAR.p]);const p=loc(s,12,0);box(c,p[0],p[1],32,38,s.a,14,PAINT2[GAR.p],14);const q=loc(s,27,0);box(c,q[0],q[1],4,32,s.a,9,'#0b1620',16);
   for(const k of[-1,1]){const h=loc(s,35,k*14);box(c,h[0],h[1],3,7,s.a,4,'#fff7a0',3);const r=loc(s,-35,k*14);box(c,r[0],r[1],3,7,s.a,4,T.brk||keys.Space?'#ff2a2a':T.gear<0?'#fff':'#7a1414',3)}}
  else{box(c,s.x,s.y,s.len,s.wd,s.a,8,'#3b4560');
   if(g.cargo>0){const h=4+g.cargo*.17,p=loc(s,g.p*7,g.o*8);box(c,p[0],p[1],s.len*.86,s.wd*.8,s.a,h,gt=='liquid'?'#3a9be8':'#a68f68',8)}}}}
function world(c,vw,vh,oy,fx,fy,s,rot,fl,main){const l=G.l;LX=-Math.sin(rot);LY=-Math.cos(rot);
 c.save();c.translate(vw/2,oy);c.scale(fl?-s:s,s);c.rotate(rot);c.translate(-fx,-fy);
 c.fillStyle='#2b3344';c.fillRect(0,0,l.w,l.h);c.strokeStyle='rgba(255,255,255,.045)';c.lineWidth=1;c.beginPath();for(let x=0;x<=l.w;x+=50){c.moveTo(x,0);c.lineTo(x,l.h)}for(let y=0;y<=l.h;y+=50){c.moveTo(0,y);c.lineTo(l.w,y)}c.stroke();
 const z=l.goal,pl=.6+.4*Math.sin(G.el*5),neon=l.type=='park'?'0,229,255':'255,180,0';
 c.shadowColor='rgb('+neon+')';c.shadowBlur=main?18:0;c.fillStyle='rgba('+neon+',.14)';c.fillRect(z.x-z.w/2,z.y-z.h/2,z.w,z.h);c.strokeStyle='rgba('+neon+','+pl+')';c.lineWidth=4;c.setLineDash([14,8]);c.strokeRect(z.x-z.w/2,z.y-z.h/2,z.w,z.h);c.setLineDash([]);c.shadowBlur=0;
 for(const r of rings){c.strokeStyle='rgba(0,229,255,'+Math.max(0,1-r.r/400)+')';c.lineWidth=5;c.beginPath();c.arc(r.x,r.y,Math.max(0,r.r),0,7);c.stroke()}
 const ws=G.walls.slice().sort((a,b)=>a[1]+a[3]-b[1]-b[3]);
 const car=['#d9484a','#4a90d9','#e8e8e8','#5bbf6a'];let ci=0;
 for(const r of ws){const x=r[0]+r[2]/2,y=r[1]+r[3]/2;if(r[4]=='c'){const col=car[ci++%4];box(c,x,y,r[2],r[3],0,12,col);box(c,x,y,r[2]*.8,r[3]*.45,0,9,'#222a38',12)}else box(c,x,y,r[2],r[3],0,20,'#566179')}
 veh(c,G);
 for(const p of parts){c.fillStyle=p.c;c.globalAlpha=Math.min(1,p.l*2);c.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}c.globalAlpha=1;c.restore()}
function overlay(c,dt){for(const p of conf){p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*8;p.l-=dt;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.globalAlpha=Math.min(1,p.l);c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore()}
 for(const t of txt){t.a+=dt;const k=1+.6*Math.exp(-5*t.a)*Math.cos(14*t.a);c.save();c.translate(t.x,t.y-t.a*(t.sz>40?0:40));c.scale(k,k);c.globalAlpha=cl(2.4-t.a,0,1);c.font='900 '+t.sz+'px system-ui';c.textAlign='center';c.lineWidth=6;c.strokeStyle='#000b';c.strokeText(t.t,0,0);c.shadowColor=t.c;c.shadowBlur=22;c.fillStyle=t.c;c.fillText(t.t,0,0);c.restore()}}

/* ===== 6. BOUCLE PRINCIPALE ===== */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1e3);last=now;
 cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#12161f';cx.fillRect(0,0,W,H);
 if(G){step(G,dt);const l=G.l,oy=H*.46;let s,fx,fy;
  if(l.type=='park'){s=Math.min(W/(l.w+40),(H-210)/(l.h+40));fx=l.w/2;fy=l.h/2}
  else{s=Math.max(.65,Math.min(W/850,H/600));G.cam[0]+=(G.x+Math.cos(G.a)*70-G.cam[0])*Math.min(1,dt*4);G.cam[1]+=(G.y+Math.sin(G.a)*70-G.cam[1])*Math.min(1,dt*4);fx=G.cam[0];fy=G.cam[1]}
  cx.save();if(shk>.3){cx.translate(rnd(-shk,shk),rnd(-shk,shk));shk*=.88}else shk=0;
  world(cx,W,H,oy,fx,fy,s,0,0,1);cx.restore();
  /* rétroviseur : vue arrière, miroir horizontal */
  mx.setTransform(DPR,0,0,DPR,0,0);mx.fillStyle='#0b0f16';mx.fillRect(0,0,200,80);
  const S=segs(G),last=S[S.length-1],bc=Math.cos(last.a),bs=Math.sin(last.a),rr=S.rear;
  world(mx,200,80,70,rr[0]-bc*85,rr[1]-bs*85,.7,-last.a+Math.PI/2,1,0);
  for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}for(let i=parts.length;i--;)if(parts[i].l<=0)parts.splice(i,1);
  for(const r of rings)r.r+=dt*320;for(let i=conf.length;i--;)if(conf[i].l<=0)conf.splice(i,1);
  overlay(cx,dt);for(let i=txt.length;i--;)if(txt[i].a>2.4)txt.splice(i,1);
  $('h1').textContent=l.n;$('h2').textContent=(l.time?'⏱ '+Math.max(0,G.t).toFixed(1)+' s':'⏱ '+G.el.toFixed(1)+' s')+'  ·  '+Math.round(Math.abs(G.v)*.25)+' km/h';
  $('h3').textContent=(l.cargo?'Cargaison '+Math.round(G.cargo)+'%':l.type=='park'?'Précision : '+(G.err==null?'–':Math.round(100-G.err*300)+'%'):'')+'  ·  Chocs '+G.hits;
  $('bi').style.width=(l.cargo?G.cargo:G.hold/.8*100)+'%';
  $('dump').style.display=l.type=='zone'&&!l.auto?'':'none'}
 else{audUpd({v:0,done:1},0,dt)}
 wh.style.transform='rotate('+wr+'rad)';requestAnimationFrame(frame)}

/* ===== 7. MENUS ===== */
function menu(t,d,again){const o=$('ov');o.classList.remove('hide');if(G)G.done=1;
 o.innerHTML='<h1>'+t+'</h1><p>'+d+'</p>'+(again!=null?'<button class="b" data-k="'+again+'">Rejouer</button>'+(SAVE[again]>0&&again<CAMP.length-1?'<button class="b" data-k="'+(again+1)+'">Niveau suivant ▶</button>':''):'')+
 '<div id="lv">'+CAMP.map((c,i)=>{const u=i==0||SAVE[i-1]>0,s=SAVE[i]||0;return '<button class="b" '+(u?'':'disabled ')+'data-k="'+i+'">'+(i+1)+'<br>'+(u?'★'.repeat(s)+'☆'.repeat(3-s):'🔒')+'</button>'}).join('')+'</div><button class="b" data-g="1">🔧 Garage · '+GAR.c+' 🪙</button>';
 o.querySelectorAll('button').forEach(b=>b.onclick=()=>b.dataset.g?garage():start(+b.dataset.k))}
